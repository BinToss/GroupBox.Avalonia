# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: 'gitsubmodule'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    groups:
      'Git SubModules':
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    commit-message:
      include: scope
      prefix: ci
    groups:
      'GitHub Actions':
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    commit-message:
      include: scope
      prefix: build
    groups:
      'NPM':
        patterns:
          - '*'
    ignore:
      # stage node and @types/node upgrades separately
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    commit-message:
      include: scope
      prefix: build
    groups:
      'NPM (Node)':
        patterns:
          - 'node'
          - '@types/node'

  - package-ecosystem: 'nuget'
    directory: '/GroupBox.Avalonia.Sample/'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    commit-message:
      prefix: build(sample)
      include: scope
    groups:
      'NuGet (GroupBox.Avalonia.Sample)':
        patterns:
          - '*'

  - package-ecosystem: 'nuget'
    directory: '/GroupBox.Avalonia/'
    schedule:
      interval: 'daily'
    target-branch: 'develop'
    commit-message:
      include: scope
      prefix: fix
      prefix-development: build
    groups:
      'NuGet (GroupBox.Avalonia)':
        patterns:
          - '*'
